# 开发环境专用（source set resources）：
# 与 src/main/resources 中的 dev mods.toml 保持一致（声明全部 modid），
# 三个 source set 合并为同一个 mod file。
modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"

[[mods]]
modId = "kazumiplayer"
version = "0.1-alpha"
displayName = "KazumiPlayer"
description = '''KazumiPlayer (dev)'''

[[mods]]
modId = "kazumiplayer_server"
version = "0.1-alpha"
displayName = "KazumiPlayer Server"
description = '''KazumiPlayer 服务端附加模块 (dev)'''

[[mods]]
modId = "kazumiplayer_client"
version = "0.1-alpha"
displayName = "KazumiPlayer Client"
description = '''KazumiPlayer 客户端附加模块 (dev)'''

# 客户端专用 mixin（文本渲染优化，移植自 ImmediatelyFast）。开发环境下 classpath 顺序为
# client classes/resources → main → server，FML 取第一份 mods.toml，故 runClient 读到的是本文件（含本段）；
# runServer 的 classpath 不含 client source set（读到 main 那份，无本段），服务端不会去找客户端 mixin 配置。
[[mixins]]
config = "kazumiplayer.client.mixins.json"

[[dependencies."kazumiplayer"]]
modId = "neoforge"
type = "required"
versionRange = "[26,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."kazumiplayer"]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies."kazumiplayer"]]
modId = "rinku"
type = "optional"
versionRange = "[3.0.4,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."kazumiplayer"]]
modId = "watermedia"
type = "optional"
versionRange = "[3.0.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."kazumiplayer"]]
modId = "cloth_config"
type = "optional"
versionRange = "[26.1.154,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.kazumiplayer_server]]
modId = "kazumiplayer"
type = "required"
versionRange = "[0.1-alpha,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.kazumiplayer_client]]
modId = "kazumiplayer"
type = "required"
versionRange = "[0.1-alpha,)"
ordering = "AFTER"
side = "BOTH"
