modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mods]]
modId = "kazumiplayer_server"
version = "${mod_version}"
displayName = "KazumiPlayer Server"
description = '''KazumiPlayer 服务端附加模块：命令、同步组与 C→S 包处理（集成服务端同样需要）。'''

[[mods]]
modId = "kazumiplayer_client"
version = "${mod_version}"
displayName = "KazumiPlayer Client"
description = '''KazumiPlayer 客户端附加模块：渲染、播放与 S→C 包处理。'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "mcef"
type = "optional"
versionRange = "[2.2.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "watermedia"
type = "optional"
versionRange = "[3.0.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "cloth_config"
type = "optional"
versionRange = "[26.1.154,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.kazumiplayer_server]]
modId = "${mod_id}"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.kazumiplayer_client]]
modId = "${mod_id}"
type = "required"
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "BOTH"
