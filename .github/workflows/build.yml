name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 8.8 最高支持 Java 22，需用旧 JDK 运行 Gradle；
      # 项目编译 toolchain 为 Java 25，由 foojay-resolver 自动下载
      - name: Set up JDK 21 (Gradle runtime)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build jars
        run: ./gradlew assemble --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kazumiplayer-jars
          path: |
            build/libs/kazumiplayer-server-*.jar
            build/libs/kazumiplayer-client-*.jar
          if-no-files-found: error
