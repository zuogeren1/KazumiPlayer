plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    // 公共库（gson/jsoup/zxing）与依赖传递解析
    mavenCentral()
    maven {
        url = "https://keksuccino.github.io/maven/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Fix modDevApiElements / universalJar variant conflict
configurations.all {
    attributes {
        attribute(
            org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
            project.objects.named(org.gradle.api.attributes.Usage.class,
                org.gradle.api.attributes.Usage.JAVA_RUNTIME)
        )
    }
}

// =====================================================================
// 多 source set 拆分: main(common) / server / client
// - main   = 两端共享代码 (方块/网络/规则/工具)
// - server = 服务端专属 (命令/同步组/搜索/C→S 包处理)
// - client = 客户端专属 (播放/渲染/tick/S→C 包处理)，编译依赖 main+server
//           （客户端进程运行集成服务端时同样需要 server 代码）
// =====================================================================
sourceSets {
    server {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    client {
        compileClasspath += sourceSets.main.output + sourceSets.server.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.server.output + sourceSets.main.runtimeClasspath
    }
}

// 依赖传递: server/client 可见 common 的依赖 (gson/jsoup 等)
configurations {
    serverImplementation.extendsFrom implementation
    serverCompileOnly.extendsFrom compileOnly
    serverRuntimeOnly.extendsFrom runtimeOnly
    clientImplementation.extendsFrom implementation
    clientCompileOnly.extendsFrom compileOnly
    clientRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // 使用 client source set 的运行时依赖（MCEF/WaterMedia）
            sourceSet = sourceSets.client
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            sourceSet = sourceSets.server
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.server
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            sourceSet = sourceSets.client
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.server)
            sourceSet(sourceSets.client)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // 共享依赖 (common)
    implementation "com.google.code.gson:gson:2.11.0"
    jarJar(implementation("org.jsoup:jsoup:1.18.1"))
    // 二维码生成（B 站扫码登录）：纯 Java 核心库，无 AWT 依赖
    jarJar(implementation("com.google.zxing:core:3.5.3"))

    // 客户端专用依赖 (client only)
    // Rinku（原 MCEF）- Chromium Embedded Framework for video URL sniffing
    clientImplementation("de.keksuccino:rinku-neoforge:3.0.4-26.1.2") {
        exclude group: "net.neoforged", module: "neoforge"
    }
    // WaterMedia - VLC-powered media player (Modrinth) - API 3.0.0.23
    clientImplementation "maven.modrinth:G922NeHS:FdCZ5Rxq"
    // WaterMedia Binaries - native VLC/FFMPEG (3.0.0.6 matches API 3.0.0.23)
    clientImplementation "maven.modrinth:4997XcoK:fYWsOuBz"
    // Cloth Config API - 客户端可选配置界面（不装也能运行）
    clientImplementation "maven.modrinth:9s6osm5g:TimoYzse"
}

// ---- mod 元数据生成（两份 mods.toml） ----

var modMetadataProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]

var generateServerModMetadata = tasks.register("generateServerModMetadata", ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.properties modMetadataProperties
    expand modMetadataProperties
    from "src/main/templates"
    into "build/generated/sources/serverModMetadata"
}

var generateClientModMetadata = tasks.register("generateClientModMetadata", ProcessResources) {
    filteringCharset = 'UTF-8'
    inputs.properties modMetadataProperties
    expand modMetadataProperties
    from "src/client/templates"
    into "build/generated/sources/clientModMetadata"
}

// jar-in-jar 内嵌清单：由 configurations.jarJar 解析结果生成，与依赖声明同源。
// 手写 META-INF/jarjar/metadata.json 会与依赖漂移——zxing 的内嵌 jar 曾在包里而清单漏登记，
// 正式包因此不加载该类（生产环境扫码登录 NoClassDefFoundError，开发期 classpath 直供故不复现）。
var generateJarJarMetadata = tasks.register('generateJarJarMetadata') {
    var jarJarConfig = configurations.jarJar
    var outputDir = layout.buildDirectory.dir('generated/jarjar-metadata')
    inputs.files(jarJarConfig)
    outputs.dir(outputDir)
    doLast {
        var jars = jarJarConfig.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
            var id = artifact.moduleVersion.id
            [
                identifier  : [group: id.group, artifact: id.name],
                version     : [range: "[${id.version},)", artifactVersion: id.version],
                path        : "META-INF/jarjar/${artifact.file.name}",
                isObfuscated: false
            ]
        }
        var target = outputDir.get().file('META-INF/jarjar/metadata.json').asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([jars: jars]))
    }
}

neoForge.ideSyncTask generateServerModMetadata
neoForge.ideSyncTask generateClientModMetadata

// ---- 双 jar 输出 ----

// 服务端 jar: common + server
tasks.register('serverJar', Jar) {
    group = 'build'
    description = '构建服务端 jar (common + server)，不包含任何客户端类'
    archiveBaseName = 'kazumiplayer-server'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 开发用 mods.toml（各 source set resources 中的单 modid 版）不进入正式 jar
    from(sourceSets.main.output) { exclude 'META-INF/neoforge.mods.toml' }
    from(sourceSets.server.output) { exclude 'META-INF/neoforge.mods.toml' }
    from generateServerModMetadata.map { it.destinationDir }
    from generateJarJarMetadata
    from(configurations.jarJar) {
        into 'META-INF/jarjar'
    }
}

// 客户端 jar: common + server + client（集成服务端在客户端进程运行，故含 server）
tasks.register('clientJar', Jar) {
    group = 'build'
    description = '构建客户端 jar (common + server + client)'
    archiveBaseName = 'kazumiplayer-client'
    archiveVersion = project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output) { exclude 'META-INF/neoforge.mods.toml' }
    from(sourceSets.server.output) { exclude 'META-INF/neoforge.mods.toml' }
    from(sourceSets.client.output) { exclude 'META-INF/neoforge.mods.toml' }
    from generateClientModMetadata.map { it.destinationDir }
    from generateJarJarMetadata
    from(configurations.jarJar) {
        into 'META-INF/jarjar'
    }
}

tasks.named('assemble') {
    dependsOn 'serverJar', 'clientJar'
}

// 默认 jar 仅含 common 类（中间产物，无 mods.toml），直接禁用，只产出正式双 jar
tasks.named('jar') {
    enabled = false
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
